name: Build & Release

# Builds ClipMate on a GitHub-hosted Mac and publishes ClipMate.dmg.
#
# - Push a tag like `v1.5.0`          → normal release (becomes "latest").
# - Push a tag like `v1.5.0-beta.1`   → pre-release, for testing; the README's
#                                       "latest" download link is untouched.
# - Push to main / open a PR / run manually → just builds; the DMG is attached to the
#                                       run as an artifact.
on:
  push:
    tags: ['v*']
    branches: [main]     # build-check every change to main (no release)
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project ClipMate.xcodeproj \
            -scheme ClipMate \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="" \
            build | tee build.log

      # Code signing decides whether macOS remembers ClipMate's permissions
      # across updates. macOS ties Accessibility / Screen Recording to the
      # signature: with ad-hoc signing every build is a "new app" and users must
      # re-allow (or use ClipMate's "Fix Permission" button) after each update.
      #
      # Add these repo secrets (Settings ▸ Secrets and variables ▸ Actions):
      #   DEVELOPER_ID_CERT_P12      base64 of a code-signing .p12 — EITHER
      #                              • a free self-signed certificate (Keychain
      #                                Access ▸ Certificate Assistant ▸ Create a
      #                                Certificate…, type "Code Signing"): permissions
      #                                then survive updates; or
      #                              • a paid "Developer ID Application" certificate:
      #                                permissions survive AND the "Apple could not
      #                                verify" warning disappears (with notarization).
      #   DEVELOPER_ID_CERT_PASSWORD password of that .p12
      # Notarization (Developer ID only):
      #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      - name: Sign app
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          APP="build/Build/Products/Release/ClipMate.app"
          if [ -n "$CERT_P12" ]; then
            KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
            security create-keychain -p ci "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p ci "$KEYCHAIN"
            echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

            # A self-signed certificate must be trusted for code signing on the
            # runner, or codesign refuses it. (Developer ID is trusted already.)
            openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin env:CERT_PASSWORD -legacy -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
              || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -clcerts -nokeys -passin env:CERT_PASSWORD -out "$RUNNER_TEMP/cert.pem"
            if ! grep -q "Developer ID" <(openssl x509 -in "$RUNNER_TEMP/cert.pem" -noout -subject); then
              sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
            fi

            IDENTITY=$(security find-identity -p codesigning "$KEYCHAIN" | grep -m1 '"' | awk -F'"' '{print $2}')
            echo "Signing with: $IDENTITY"
            TIMESTAMP="--timestamp=none"
            [[ "$IDENTITY" == "Developer ID Application"* ]] && TIMESTAMP="--timestamp"
            codesign --force --deep --options runtime $TIMESTAMP \
              --entitlements ClipMate/ClipMate.entitlements --sign "$IDENTITY" "$APP"
            if [[ "$IDENTITY" == "Developer ID Application"* ]]; then
              echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
            fi
          else
            codesign --force --deep --sign - "$APP"
            echo "::warning::No signing certificate secret — app is ad-hoc signed. macOS will warn on first launch and ask for permissions again after every update."
          fi
          codesign --verify --verbose "$APP"
          codesign -d -r- "$APP" || true

      - name: Package DMG
        run: |
          APP="build/Build/Products/Release/ClipMate.app"
          mkdir -p dmg
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname ClipMate -srcfolder dmg -ov -format UDZO ClipMate.dmg

      - name: Notarize DMG
        if: env.SIGN_IDENTITY != '' && env.HAS_APPLE_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          codesign --force --timestamp --sign "$SIGN_IDENTITY" ClipMate.dmg
          xcrun notarytool submit ClipMate.dmg \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple ClipMate.dmg

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipMate-dmg
          path: ClipMate.dmg

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          PRE=""
          if [[ "$TAG" == *-* ]]; then PRE="--prerelease"; fi
          gh release create "$TAG" ClipMate.dmg \
            --title "ClipMate ${TAG#v}" \
            --notes-file .github/release-notes.md \
            --verify-tag $PRE
